<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Pequeños Sanos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>📩 Contáctanos</h1>
        <p>Estamos aquí para orientarte</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="informacion.html">Información</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main>
        <section class="formulario">
            <h2>Formulario de contacto</h2>
            <p>Completa los siguientes campos.</p>

            <form id="formContacto">
                <label for="nombre">Nombre del padre, madre o tutor:</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Escribe tu nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo"
                       placeholder="ejemplo@correo.com" required>

                <label for="telefono">Teléfono (opcional):</label>
                <input type="tel" id="telefono" name="telefono"
                       placeholder="Tu número de teléfono">

                <label for="asunto">Motivo del contacto:</label>
                <select id="asunto" name="asunto" required>
                    <option value="">Selecciona una opción</option>
                    <option value="consulta">Información sobre consultas</option>
                    <option value="servicios">Servicios pediátricos</option>
                    <option value="horarios">Horarios de atención</option>
                    <option value="otro">Otro</option>
                </select>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5"
                          placeholder="Escribe tu mensaje"
                          required></textarea>

                <button type="submit" class="boton">
                    Enviar mensaje
                </button>

                <p id="respuesta" role="status"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>Pequeños Sanos | Proyecto escolar de Pediatría</p>
    </footer>

    <script>
        document.getElementById("formContacto").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("respuesta").textContent =
                "Formulario de demostración completado. Los datos no se han enviado.";

            this.reset();
        });
    </script>

</body>
</html>
